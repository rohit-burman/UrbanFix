services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: urbanfix
      POSTGRES_PASSWORD: urbanfix
      POSTGRES_DB: urbanfix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,Z

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: urbanfix
      RABBITMQ_DEFAULT_PASS: urbanfix
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
